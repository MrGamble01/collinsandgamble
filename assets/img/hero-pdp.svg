<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 580" role="img" aria-labelledby="hero-art-title">
  <title id="hero-art-title">A stylized Amazon product page with the on-site review video highlighted next to the buy box</title>

  <!-- Top: product image (left) + product info (right) -->
  <rect x="40" y="40" width="200" height="200" rx="10" fill="rgba(246,241,231,0.04)" stroke="rgba(246,241,231,0.10)" stroke-width="1"/>
  <!-- subtle product silhouette -->
  <path d="M 100 200 L 100 140 Q 100 110 130 110 L 150 110 Q 180 110 180 140 L 180 200 Z M 130 110 L 130 90 L 150 90 L 150 110"
        fill="none" stroke="rgba(232,158,60,0.40)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="140" cy="158" r="6" fill="rgba(232,158,60,0.40)"/>

  <!-- Title -->
  <text x="270" y="70" font-family="Fraunces, serif" font-size="22" font-style="italic" fill="#f6f1e7" letter-spacing="-0.02em">Bronze Bottle Opener</text>
  <text x="270" y="94" font-family="Inter, system-ui, sans-serif" font-size="10.5" letter-spacing="0.22em" fill="rgba(246,241,231,0.58)" font-weight="600">SOLID BRASS · GIFT-BOXED</text>

  <!-- Stars + rating -->
  <g transform="translate(270 116)">
    <g fill="#e89e3c">
      <polygon points="0,7 7,5.5 9,0 11,5.5 18,7 12.5,11.5 14,18 9,14.5 4,18 5.5,11.5"/>
      <polygon points="24,7 31,5.5 33,0 35,5.5 42,7 36.5,11.5 38,18 33,14.5 28,18 29.5,11.5"/>
      <polygon points="48,7 55,5.5 57,0 59,5.5 66,7 60.5,11.5 62,18 57,14.5 52,18 53.5,11.5"/>
      <polygon points="72,7 79,5.5 81,0 83,5.5 90,7 84.5,11.5 86,18 81,14.5 76,18 77.5,11.5"/>
    </g>
    <polygon points="96,7 103,5.5 105,0 107,5.5 114,7 108.5,11.5 110,18 105,14.5 100,18 101.5,11.5" fill="rgba(232,158,60,0.30)"/>
    <text x="124" y="14" font-family="Inter, system-ui, sans-serif" font-size="12" fill="rgba(246,241,231,0.80)">4.6 · 2,431 reviews</text>
  </g>

  <!-- Price -->
  <text x="270" y="170" font-family="Fraunces, serif" font-size="28" fill="#f6f1e7" letter-spacing="-0.02em">$24.<tspan font-size="20" dy="-2">99</tspan></text>
  <text x="270" y="196" font-family="Inter, system-ui, sans-serif" font-size="11" fill="rgba(246,241,231,0.58)" font-style="italic">In stock · Ships in 1 day</text>

  <!-- Add to cart button -->
  <rect x="270" y="214" width="180" height="34" rx="17" fill="#e89e3c"/>
  <text x="360" y="236" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0a0c10" letter-spacing="0.04em">Add to cart</text>

  <!-- Divider -->
  <line x1="40" y1="290" x2="520" y2="290" stroke="rgba(246,241,231,0.12)" stroke-width="1"/>

  <!-- Customer videos label -->
  <text x="40" y="322" font-family="Inter, system-ui, sans-serif" font-size="11" letter-spacing="0.24em" fill="rgba(246,241,231,0.58)" font-weight="600">CUSTOMER VIDEOS</text>
  <text x="520" y="322" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="11" fill="rgba(246,241,231,0.40)">4 of 28</text>

  <!-- thumb 1 (dim) -->
  <g transform="translate(40 348)">
    <rect width="100" height="76" rx="6" fill="rgba(246,241,231,0.05)" stroke="rgba(246,241,231,0.10)" stroke-width="1"/>
    <polygon points="42,28 42,48 58,38" fill="rgba(246,241,231,0.30)"/>
    <text x="50" y="93" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="9" fill="rgba(246,241,231,0.40)">0:38</text>
  </g>
  <!-- thumb 2 (dim) -->
  <g transform="translate(160 348)">
    <rect width="100" height="76" rx="6" fill="rgba(246,241,231,0.05)" stroke="rgba(246,241,231,0.10)" stroke-width="1"/>
    <polygon points="42,28 42,48 58,38" fill="rgba(246,241,231,0.30)"/>
    <text x="50" y="93" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="9" fill="rgba(246,241,231,0.40)">0:42</text>
  </g>

  <!-- thumb 3 (HIGHLIGHTED — the on-site review) -->
  <g transform="translate(276 340)">
    <rect x="-6" y="-6" width="120" height="100" rx="12" fill="rgba(232,158,60,0.08)"/>
    <rect width="108" height="88" rx="7" fill="rgba(232,158,60,0.07)" stroke="#e89e3c" stroke-width="1.6"/>
    <circle cx="10" cy="10" r="4" fill="#e89e3c"/>
    <circle cx="10" cy="10" r="7.5" fill="none" stroke="#e89e3c" stroke-width="1" opacity="0.45"/>
    <circle cx="54" cy="44" r="18" fill="#e89e3c" opacity="0.18"/>
    <polygon points="46,34 46,54 64,44" fill="#e89e3c"/>
    <text x="54" y="113" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#e89e3c" font-weight="600" letter-spacing="0.08em">0:31 · ON-SITE REVIEW</text>
  </g>

  <!-- thumb 4 (dim) -->
  <g transform="translate(400 348)">
    <rect width="100" height="76" rx="6" fill="rgba(246,241,231,0.05)" stroke="rgba(246,241,231,0.10)" stroke-width="1"/>
    <polygon points="42,28 42,48 58,38" fill="rgba(246,241,231,0.30)"/>
    <text x="50" y="93" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="9" fill="rgba(246,241,231,0.40)">0:55</text>
  </g>

  <!-- Annotation: curved arrow + label -->
  <path d="M 340 510 Q 340 478 322 458" fill="none" stroke="#e89e3c" stroke-width="1.4" stroke-linecap="round"/>
  <polygon points="318,456 328,460 324,468" fill="#e89e3c"/>
  <text x="350" y="528" font-family="Fraunces, serif" font-style="italic" font-size="22" fill="#e89e3c" letter-spacing="-0.02em">you live here</text>
  <text x="350" y="548" font-family="Inter, system-ui, sans-serif" font-size="10" letter-spacing="0.18em" fill="rgba(246,241,231,0.58)" font-weight="600">NEXT TO THE BUY BOX</text>
</svg>
