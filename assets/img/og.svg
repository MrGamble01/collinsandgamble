<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Collins and Gamble">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1f27"/>
      <stop offset="1" stop-color="#0e1116"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.15" cy="0.15" r="0.7">
      <stop offset="0" stop-color="#b08a4f" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#b08a4f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <g font-family="Georgia, 'Times New Roman', serif" fill="#f6f1e7">
    <text x="80" y="160" font-size="28" letter-spacing="6" fill="#b08a4f" font-family="Inter, system-ui, sans-serif">DIGITAL MARKETING STUDIO</text>
    <text x="80" y="340" font-size="120" font-style="italic">Collins<tspan fill="#b08a4f"> &amp; </tspan>Gamble</text>
    <text x="80" y="430" font-size="40" fill="#f6f1e7" font-family="Georgia, serif">Brands that show up — and stay there.</text>
    <text x="80" y="560" font-size="22" fill="#b08a4f" font-family="Inter, system-ui, sans-serif" letter-spacing="4">COLLINSANDGAMBLE.COM</text>
  </g>
