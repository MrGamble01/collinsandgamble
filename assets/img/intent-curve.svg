<line x1="470" y1="78" x2="470" y2="290" stroke="rgba(246,241,231,0.20)" stroke-width="1" stroke-dasharray="3 3"/>
<circle cx="470" cy="80" r="5" fill="#e89e3c"/>
<!-- peak label -->
<text x="470" y="40" text-anchor="middle" fill="#f6f1e7" font-size="11" font-weight="600" letter-spacing="0.22em" font-family="Inter, system-ui, sans-serif">ON-SITE REVIEW</text>
<text x="470" y="62" text-anchor="middle" fill="#e89e3c" font-size="14" font-family="Fraunces, serif" font-style="italic">lives here</text>
<!-- baseline -->
<line x1="40" y1="250" x2="680" y2="250" stroke="rgba(246,241,231,0.12)" stroke-width="1"/>
<!-- stage markers -->
<g font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">
  <circle cx="90"  cy="250" r="3.5" fill="#0a0c10" stroke="rgba(246,241,231,0.40)" stroke-width="1.4"/>
  <circle cx="220" cy="250" r="3.5" fill="#0a0c10" stroke="rgba(246,241,231,0.40)" stroke-width="1.4"/>
  <circle cx="350" cy="250" r="3.5" fill="#0a0c10" stroke="rgba(246,241,231,0.40)" stroke-width="1.4"/>
  <circle cx="470" cy="250" r="4.5" fill="#e89e3c"/>
  <circle cx="610" cy="250" r="3.5" fill="#0a0c10" stroke="rgba(246,241,231,0.40)" stroke-width="1.4"/>
  <text x="90"  y="272" fill="rgba(246,241,231,0.58)">discovery</text>
  <text x="220" y="272" fill="rgba(246,241,231,0.58)">interest</text>
  <text x="350" y="272" fill="rgba(246,241,231,0.58)">research</text>
  <text x="470" y="272" fill="#f6f1e7" font-weight="600">decision</text>
  <text x="610" y="272" fill="rgba(246,241,231,0.58)">purchase</text>
</g>
<!-- channel brackets -->
<g font-family="Inter, system-ui, sans-serif" font-size="9" letter-spacing="0.22em" text-anchor="middle">
  <line x1="90" y1="298" x2="350" y2="298" stroke="rgba(246,241,231,0.20)" stroke-width="1"/>
  <line x1="90" y1="295" x2="90" y2="298" stroke="rgba(246,241,231,0.20)" stroke-width="1"/>
  <line x1="350" y1="295" x2="350" y2="298" stroke="rgba(246,241,231,0.20)" stroke-width="1"/>
