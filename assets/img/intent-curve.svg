<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="d1-title">
<title id="d1-title">Where the on-site review lives in the shopper journey</title>
<!-- intent area -->
<path d="M 40 250 C 130 240, 195 220, 255 200 C 305 184, 345 158, 420 96 C 460 64, 495 70, 530 100 C 590 150, 640 218, 680 240 L 680 250 L 40 250 Z"
      fill="rgba(232,158,60,0.07)"/>
